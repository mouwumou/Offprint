# yaml-language-server: $schema=schema/site-config.schema.json
#
# ──────────────────────────────────────────────────────────────────────────────
# Offprint 站点配置（ADR-021）。这一个文件 = 站点长什么样，不含任何内容。
# 你是谁在 content/profile.yaml（ADR-028）；页面里显示什么在 content/ 目录；首页的排布在 content/home.yaml；
# 装进来的扩展（主题/部件/模块）在 extensions/。密钥只放 .env，永不进仓库。
#
# 所有键都会在构建时校验：拼错键、类型不对会直接报错并指出位置。
# 双语字段两种写法都行：  title: Hello   或   title: { en: Hello, zh: 你好 }
# 不需要的行注释掉即可。
# ──────────────────────────────────────────────────────────────────────────────

# ── 模块开关：false = 页面、导航、打包一起消失 ────────────────────────────────
# 也可以写成对象来覆盖落地页文案，例如：
#   blog: { title: { en: Field notes, zh: 田野笔记 }, colophon: false, related: false, search: false }
#   （colophon 是文末"后记"框：默认不显示，给一段双语文字才出现；related 是"相关文章"块；search: false 整个去掉站内搜索）
modules:
  blog: true
  pages: true
  publications: true
  projects: true
  cv: true
#   publications: { order: file }                  # 同年内顺序：file（默认，按文件里的顺序）| key | title
#   cv: { indexable: false }                       # 简历页不进搜索引擎（noindex + 不进 sitemap + Disallow）
#   cv: { pdf: assets/cv.pdf, indexable: false }   # 或：CV 直接给 PDF 文件，不生成 HTML 页

# ── 导航：不写 = 自动生成（首页 + 开着的模块 + nav:true 的独立页面）────────────
# 写了就完全按这个列表来。三种条目：
#   - { module: blog, label: { en: Notes } }   模块落地页（label 可省）
#   - { page: about }                          content/pages 里的独立页面
#   - { href: 'https://…', label: { en: Lab } }  任意链接
# nav:
#   - { module: home }
#   - { module: blog }

# ── 页面栏宽：全站统一（含导航与页脚）。narrow（学术窄栏，默认）| wide（宽栏，配 paper）
# layout:
#   width: narrow

# ── 头部与页脚 ────────────────────────────────────────────────────────────────
# 学术形态（默认）：header 是纯导航行——名字已经在首页正文里，站名重复且窄栏放不下；
# 想要杂志式站名头（配 paper/wide），把 title/subtitle 两行删掉即可恢复。
header:
  title: false
  subtitle: false
#   search: true
#   themeToggle: true
#   languageSwitcher: true
# footer:
#   enabled: true
#   colophon: { en: Hand-set in Charter., zh: 手排于 Charter。 }   # 页脚署名行；默认只有 © 年份
#   rss: true

# ── 外观：内置主题 scholar（默认，学术白底）| paper（杂志纸面风，配 hero 排布）；
#    安装的主题放 extensions/themes/<name>/（docs/THEMING.md，只读，一切可调项在这里配）
# theme:
#   name: paper
#   accent: '#1756a9'           # 只换主色
#   tokens: { radius: 0px }     # 逐个覆盖设计变量
#   typography: { proseSize: 1rem }   # 正文字号（默认 1.0625rem = 17px）
#   options: {}                 # 该主题声明的选项（编辑器有补全）

# ── SEO ───────────────────────────────────────────────────────────────────────
# seo:
#   person: false               # 不在首页输出 schema.org Person 结构化数据

# ── 语言：默认语言在根路径，其余带 /zh 一类前缀 ───────────────────────────────
i18n:
  default: en
  locales: [en, zh]
#   noindex: [zh]               # 这些语言不进搜索引擎（robots noindex + 不进 sitemap + Disallow）

# ── 评论（giscus）：四个参数配齐才会开启 ──────────────────────────────────────
# comments:
#   enabled: true
#   repo: owner/repo
#   repoId: …
#   category: Announcements
#   categoryId: …

# ── 旧站跳转：旧路径 → 新路径（或 { destination, status }）────────────────────
redirects:
  /posts/example: /blog/publishing-from-notion
  /feed: { destination: /rss.xml, status: 301 }
