# Dual-mode builds, unit tests, e2e (incl. dual-mode HTML parity), content
# validation and Lighthouse, across Node LTS lines.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Content validation: non-compliant content fails CI.
      - run: pnpm sync validate
      - run: pnpm build:static
      - run: pnpm build:server
      - run: pnpm exec playwright install --with-deps chromium
      # Includes the dual-mode HTML parity suite and the axe audit.
      - run: pnpm e2e
      # Lighthouse thresholds >= 0.95; .offprint/e2e/dist was built by the e2e run.
      - run: pnpm lhci
        if: matrix.node == 22
      # Theme contract gate: the second built-in theme and an extensions-only
      # fixture theme (CSS hooks + a theme-carried widget) must pass the whole
      # e2e suite in an isolated copy of the tree.
      - run: pnpm theme:check paper
        if: matrix.node == 24
      - run: pnpm theme:check gutter e2e/fixtures/themes/gutter
        if: matrix.node == 24
