# P1-12: Vercel deployment (static output; server mode arrives with the
# vercel adapter in phase 2). Requires secrets VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID. Runs only when the token secret is configured.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_VERCEL == 'true' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --prebuilt uploads the .vercel/output that `vercel build` produces —
      # it does NOT accept a bare Astro dist/, hence the pull/build/deploy
      # trio (Vercel CLI docs, "Deploying from CLI").
      # VERCEL_TOKEN via env, not --token= on the CLI (argv is visible to
      # co-located steps via /proc).
      - run: pnpm dlx vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm dlx vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
