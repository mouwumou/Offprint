# P1-14: the GitHub-Action form of sync (DYNAMIC-PUBLISHING §0, serverless
# path): schedule/dispatch → elog → normalize → commit content/ → the push
# retriggers CI + deploy. Publishing latency = build time (1–3 min).
name: Sync from Notion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [notion-sync]

concurrency:
  group: notion-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
          DEFAULT_LANG: en
      - name: Commit content changes
        run: |
          git config user.name "offprint-sync[bot]"
          git config user.email "noreply@example.com"
          git add content/
          if git diff --cached --quiet; then
            echo "content unchanged"
          else
            git commit -m "chore(content): sync from Notion"
            git push
          fi
