# P1-14: the GitHub-Action form of sync (DYNAMIC-PUBLISHING §0, serverless
# path): schedule/dispatch → elog → normalize → commit content/ → explicit
# workflow_dispatch of the deploy workflows. The push alone cannot retrigger
# them: events caused by GITHUB_TOKEN never start new workflow runs — the
# documented exception is dispatching via the API, which is what we do below.
# Publishing latency = build time (1–3 min).
name: Sync from Notion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [notion-sync]

concurrency:
  group: notion-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    # ADR-017: this workflow only runs on INSTANCE repositories. The template
    # repo never carries Notion credentials, so the job is gated behind an
    # explicit repository variable — set SYNC_ENABLED=true (Settings →
    # Variables) plus the NOTION_* secrets in your own repo to activate it.
    # Unset, every scheduled run shows as skipped instead of a red failure.
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
          DEFAULT_LANG: en
      - name: Commit content changes
        id: commit
        run: |
          git config user.name "offprint-sync[bot]"
          git config user.email "noreply@example.com"
          git add content/
          if git diff --cached --quiet; then
            echo "content unchanged"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(content): sync from Notion"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deploys
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
