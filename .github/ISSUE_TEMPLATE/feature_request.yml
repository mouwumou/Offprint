name: 功能建议 / Feature request
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 先说场景与痛点，再说方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案 / Proposal
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: 它属于哪个模块，配置项叫什么 / Which module & config key
      description: Offprint 的模块都可关——新功能要能被 site.yaml 开关。不确定就写"不确定"。
    validations:
      required: true
